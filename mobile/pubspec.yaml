name: matirkhamar
description: Matir Khamar - the farm's own Android app (the website inside, with chat-style notifications).
publish_to: none
version: 3.0.0+4

environment:
    sdk: '>=3.5.0 <4.0.0'

dependencies:
    flutter:
        sdk: flutter
    firebase_core: ^3.13.0
    firebase_messaging: ^15.2.5
    flutter_local_notifications: ^19.1.0
    flutter_inappwebview: ^6.1.5
    permission_handler: ^12.0.0
    url_launcher: ^6.3.1
    http: ^1.2.2

dev_dependencies:
    flutter_launcher_icons: ^0.14.3

flutter:
    uses-material-design: true

flutter_launcher_icons:
    android: true
    ios: false
    image_path: assets/icon.png
    min_sdk_android: 23
