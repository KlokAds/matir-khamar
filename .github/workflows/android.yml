name: Android app

# Builds the farm's Android app (mobile/) in the cloud and publishes the APK as a release;
# the login page's download button always points at the newest one. One version a week at
# most: Friday night (Bangladesh), and only when mobile/ changed since the last release. It
# can also be started by hand from the Actions tab.
on:
  schedule:
    - cron: '0 16 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Anything new for the app this week?
        id: changed
        run: |
          last=$(git tag -l 'android-v*' --sort=-creatordate | head -n 1)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$last" ] && git diff --quiet "$last" HEAD -- mobile/; then
            echo "No app changes since $last."
            echo "build=no" >> "$GITHUB_OUTPUT"
          else
            echo "build=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.changed.outputs.build == 'yes'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.changed.outputs.build == 'yes'
        with:
          channel: stable
          cache: true

      - name: Make and build the APK
        if: steps.changed.outputs.build == 'yes'
        working-directory: mobile
        run: bash tool/build.sh
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/khamar.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - uses: softprops/action-gh-release@v2
        if: steps.changed.outputs.build == 'yes'
        with:
          tag_name: android-v${{ github.run_number }}
          name: মাটির খামার অ্যাপ ${{ github.run_number }}
          body: The farm's Android app. Install over the earlier one; sign-in stays.
          files: mobile/matir-khamar.apk
          make_latest: true
