name: Keep the farm clock running

# The live site runs its own clock (php artisan khamar:clock) for reminders and phone alarms.
# The host can stop background processes; any visit to the site starts the clock again. This
# knocks on the site every five minutes, so the clock is back within minutes even when nobody
# has the app open. No secrets: the health page is public and does nothing else.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  knock:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Only a knock: if the host is busy for a moment (it answers 503 now and then at night),
      # the next knock five minutes later does the job, so a missed one is not a failure and
      # sends no email.
      - name: Visit the site
        run: |
          code=$(curl -sS --max-time 25 --retry 2 --retry-delay 5 -o /dev/null -w '%{http_code}' https://khamar.klokads.com/up || true)
          echo "khamar.klokads.com/up answered: ${code:-no answer}"
          if [ "$code" != "200" ]; then
            echo "::notice::The site did not answer this time; the next knock will try again."
          fi
