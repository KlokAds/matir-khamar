name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: |
          set -o pipefail
          composer ci:check 2>&1 | tee ci.log

      # Job logs need a GitHub login; annotations do not, so the failure is readable from the API.
      - name: Show the failure as an annotation
        if: failure()
        run: |
          msg=$(tail -n 80 ci.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/
/%0A/g' | sed -e 's//%0D/g')
          echo "::error title=Last lines of the failed check::${msg}"
