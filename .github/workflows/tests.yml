name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: |
          set -o pipefail
          composer ci:check 2>&1 | tee ci.log

      # Job logs need a GitHub login; the run summary does not, so a failure is readable there.
      - name: Show the failure on the run page
        if: failure()
        run: |
          {
            echo '### Last lines of the failed check'
            echo '```'
            tail -n 120 ci.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
